# Fly.io デプロイ設定（無料相当の小規模構成前提 / WebSocket対応）
# 使い方:
#   fly launch --no-deploy   # アプリ名の確定（このファイルがあれば設定を取り込む）
#   fly volumes create keiba_data --size 1 --region nrt   # プレイヤーデータ永続化用（初回のみ）
#   fly deploy
# 注意: Fly.io の課金体系は変動するため、無料で収まるかはデプロイ時点の公式情報で確認すること。
# ボリュームを作らない場合、[mounts] と [env] の DATA_DIR を外せばデータは揮発する（再デプロイで消える）。

app = "keiba-multiplayer"
primary_region = "nrt"

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  # WebSocket の長時間接続があるため自動停止はオフ、最低1台は常時起動
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# プレイヤーデータ（players.json）の永続化先ボリューム
[[mounts]]
  source = "keiba_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
